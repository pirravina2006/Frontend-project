<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <form>
            <fieldset>
                <legend>Students detail form</legend><br>
                <label for="name">Name:</label>
                <input type="text" id="name" placeholder="username"><br><br>
                <label for="age">Age:</label>
                <input type="number" id="age" placeholder="age" min="1" max="2"><br><br>
                <label type="dob">Date of Birth:</label>
                <input type="date" id="dob"><br><br>
                <label for="date">Date:</label>
                <input type="date" id="date" min="2025-05-01" max="2025-05-30"><br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="email"><br><br>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" placeholder="phone"><br><br>
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="password"><br><br>
                <button>Submit</button>
                <input type="reset" value="Reset">
            </fieldset>
        </form>
    </body>
</html>
