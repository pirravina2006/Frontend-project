<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <center><table border="1" height="200" width="500">
            <caption><h1>Row and column spanning</h1></caption>
            <thead>
                <tr>
                    <th>column1</th>
                    <th>column2</th>
                    <th>column3</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td rowspan="2">row1 cell1</td>
                    <td>row1 cell2</td>
                    <td>row1 cell3</td>
                </tr>

                <tr>
                    <td>row2 cell2</td>
                    <td>row2 cell3</td>
                </tr>
                <tr>
                    <td colspan="3">row3 cell1</td>
                </tr>
            </tbody>
        </table></center>
        <p>without the table head and body we can create the table but it does not wrapped by head and body</p>
    </body>
</html>
