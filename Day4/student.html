<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <form >
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="username" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="email" required><br><br>
        <label for="age">Age:</label>
        <input type="number" id="age" placeholder="age" required><br><br>
        <label for="gender">Gender:</label>
        Male<input type="radio" name="gender"required>
        Female<input type="radio"name="gender">
        Others<input type="radio"name="gender"><br><br>
        <label for="subject">Subject:</label>
        CSS<input type="checkbox" name="subject"required>
        HTML<input type="checkbox" name="subject"required>
        JavaScript<input type="checkbox" name="subject"required><br><br>
        <label type="dob">Date of Birth:</label>
        <input type="date" id="dob"required><br><br>
        <label for="studentid">Student ID:</label>
        <input type="text" id="studentid" placeholder="student id" required><br><br>
        <label for="phone">Phone:</label>
        <input type="number" id="phone" placeholder="phone" required><br><br>
        <label for="address">Address:</label>
        <textarea id="address" placeholder="address" cols="40" rows="5" required></textarea><br><br>
        <label for="bloodgroup">Blood Group:</label>
        <select id="bloodgroup">
            <option value="A+">A+ve</option>
            <option value="A-">A-ve</option>
            <option value="B+">B+ve</option>
            <option value="B-">B-ve</option>
            <option value="O+">O+ve</option>
            <option value="O-">O-ve</option>
            <option value="AB+">AB+ve</option>
            <option value="AB-">AB-ve</option>
        </select><br><br>
        <label for="studentphoto">Student Photo:</label>
        <input type="file" id="studentphoto" accept=".png,.jpg" required><br><br>
        <label for="studentcountry">Country:</label>
        <input type="text" id="studentcountry" list="country" required>
        <datalist id="country">
            <option value="India">India</option>
            <option value="USA">USA</option>
            <option value="UK">UK</option>
            <option value="Canada">Canada</option>
            <option value="Australia">Australia</option>
            <option value="UAE">UAE</option>
            <option value="Russia">Russia</option></datalist><br><br>
        <button type="submit">Submit</button>
        </form>
    </body>
</html>
